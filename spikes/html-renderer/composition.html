<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#06121a}
  #bg{position:absolute;inset:0}
  .seg{position:absolute;left:90px;right:90px;text-align:center;opacity:0;will-change:opacity,transform}
  [lang=ar]{font-family:"Noto Naskh Arabic",serif}
  [lang=ta]{font-family:"Noto Sans Tamil",sans-serif}
  [lang=en]{font-family:"Noto Serif",serif}
  .hook{top:760px;font-size:76px;color:#f3e9d2;line-height:1.25}
  .arabic{top:600px;font-size:118px;color:#f6d58e;line-height:1.9}
  .tamil{top:930px;font-size:60px;color:#e9eef0;line-height:1.5}
  .english{top:1130px;font-size:58px;color:#bcd3dc;font-style:italic}
  .brand{top:700px;font-size:190px;color:#f6d58e;line-height:1.6}
  .brandsub{top:1080px;font-size:40px;color:#8fb0bd;letter-spacing:4px}
  #safe{position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(transparent,rgba(0,0,0,.35))}
</style></head>
<body><canvas id="bg" width="1080" height="1920"></canvas><div id="root"></div><div id="safe"></div>
<script>
// Deterministic: everything is a pure function of time t; no wall clock, no Math.random.
let M, stars=[];
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
window.setup = (manifest) => {
  M = manifest; const r = rng(42);
  for (let i=0;i<140;i++) stars.push({x:r()*1080,y:r()*1920,s:0.6+r()*2.2,p:r()*6.28});
  const root = document.getElementById('root');
  for (const s of M.segments) {
    const el = document.createElement('div');
    el.className = 'seg ' + s.role; el.lang = s.lang; el.dir = s.dir;
    el.textContent = s.text;          // textContent: exact string, no HTML interpretation
    el.dataset.start = s.start; el.dataset.end = s.end;
    root.appendChild(el);
  }
  return document.fonts.ready.then(()=>true);
};
const ease = x => x<0?0:x>1?1:x*x*(3-2*x);
window.seek = (t) => {
  const c = document.getElementById('bg').getContext('2d');
  const g = c.createLinearGradient(0,0,0,1920);
  const h = 200 + 12*Math.sin(t*0.25);
  g.addColorStop(0,`hsl(${h},55%,9%)`); g.addColorStop(1,`hsl(${h+25},45%,4%)`);
  c.fillStyle=g; c.fillRect(0,0,1080,1920);
  for (const st of stars){ c.globalAlpha=0.25+0.35*(0.5+0.5*Math.sin(st.p+t*1.3));
    c.fillStyle='#fff'; c.beginPath(); c.arc(st.x,(st.y - t*6)%1920+ (st.y - t*6<0?1920:0),st.s,0,6.283); c.fill(); }
  c.globalAlpha=1;
  for (const el of document.querySelectorAll('.seg')) {
    const a=+el.dataset.start, b=+el.dataset.end;
    const o = Math.min(ease((t-a)/0.6), ease((b-t)/0.5));
    el.style.opacity = o; el.style.transform = `translateY(${(1-ease((t-a)/0.8))*30}px)`;
  }
};
// QC hook: returns rendered strings so the harness can byte-compare with the manifest.
window.renderedTexts = () => [...document.querySelectorAll('.seg')].map(e=>e.textContent);
</script></body></html>
